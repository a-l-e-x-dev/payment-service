name: Payment Service CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-and-package:
    name: Build, Test and Create Artefact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Step 1 - Build (Compile)
        run: mvn clean compile

      - name: Step 2 - Testing (Unit & Integration)
        run: mvn test

      - name: Package JAR file
        run: mvn package -DskipTests

      - name: Step 3 - Build Docker Image
        run: docker build -t innowise/payment-service:${{ github.sha }} .

      - name: Save Docker Image as Tarball
        run: docker save innowise/payment-service:${{ github.sha }} > payment-service-image.tar

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: payment-service-docker-image
          path: payment-service-image.tar
          retention-days: 5